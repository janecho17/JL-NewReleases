<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JL NewReleases — Admin · Subir video</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="../index.html" class="brand">JL <span>NewReleases</span></a>
      <nav class="admin-nav mt-24">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="subir.html" class="active">⬆ Subir video</a>
        <a href="editar.html">✏ Editar catálogo</a>
        <a href="estadisticas.html">📈 Estadísticas</a>
        <a href="../index.html">← Volver al sitio</a>
      </nav>
    </aside>

    <main class="admin-main">
      <h1 style="font-size:1.8rem;">Subir nueva película</h1>
      <p class="muted mt-24" style="margin-bottom:20px;">El archivo de video se sube directo a Firebase Storage y queda visible en el catálogo al instante.</p>

      <form id="subir-form">
        <div>
          <label for="titulo">Título</label>
          <input id="titulo" type="text" placeholder="Título" required>
        </div>
        <div>
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" placeholder="Descripción" required></textarea>
        </div>
        <div>
          <label for="categoria">Categoría</label>
          <input id="categoria" type="text" placeholder="Ej: Acción, Drama, Documentales">
        </div>
        <div>
          <label for="portada">Portada</label>
          <input id="portada" type="file" accept="image/*" required>
        </div>
        <div>
          <label for="video">Video</label>
          <input id="video" type="file" accept="video/*" required>
        </div>
        <button type="submit">Publicar película</button>
      </form>

      <p id="estado"></p>
    </main>
  </div>

  <script type="module" src="../js/admin-subir.js"></script>
</body>
</html>
