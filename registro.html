<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JL NewReleases — Crear cuenta</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="registro.html">

  <div id="site-header"></div>

  <section class="section container" style="max-width:420px;">
    <h1 style="font-size:1.8rem;">Crear cuenta</h1>
    <p class="muted mt-24">Regístrate para guardar tus favoritos y recibir estrenos.</p>

    <form id="register-form" class="panel mt-24">
      <p id="register-error" class="mt-24" style="display:none; color:var(--accent-red); font-size:0.85rem;"></p>
      <div class="field">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" required />
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>
      <div class="field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Crear cuenta</button>
      <p class="center mt-24">
        ¿Ya tienes cuenta?
        <a href="login.html" style="color:var(--accent-gold);">Inicia sesión</a>
      </p>
    </form>
  </section>

  <div id="site-footer"></div>

  <script src="js/app.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("register-form");
      const errorBox = document.getElementById("register-error");
      form.addEventListener("submit", () => { errorBox.style.display = "none"; });
    });
  </script>
  <script type="module" src="js/registro.js"></script>
</body>
</html>
